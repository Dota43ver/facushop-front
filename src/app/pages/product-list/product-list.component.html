<h2>Listado de Productos</h2>

<div *ngIf="products.length === 0">
  <p>Cargando productos...</p>
  </div>

<div class="product-grid" *ngIf="products.length > 0">
  
  <mat-card *ngFor="let product of products" class="product-card">
    
    <a [routerLink]="['/products', product.id]">
      <img mat-card-image [src]="product.imageUrl" alt="{{ product.title }}">
    </a>
    
    <mat-card-content>
      <mat-card-title>
        <a [routerLink]="['/products', product.id]">{{ product.title }}</a>
      </mat-card-title>
      
      <p class="product-price">${{ product.price }}</p>
      
      <p class="product-stock">Stock: {{ product.stock }}</p>
    </mat-card-content>
    
    <mat-card-actions>
      <a mat-button color="primary" [routerLink]="['/products', product.id]">
        VER DETALLE
      </a>
      <button mat-flat-button color="primary" (click)="onAddToCart(product)">
        Añadir al Carrito
      </button>
    </mat-card-actions>
  </mat-card>

</div>
