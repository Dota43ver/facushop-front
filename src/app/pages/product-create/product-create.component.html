<div class="create-container">
  <mat-card class="create-card">
    <mat-card-header>
      <mat-card-title>Vender un Producto</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Título del Producto</mat-label>
          <input matInput formControlName="title">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Descripción</mat-label>
          <textarea matInput formControlName="description" rows="4"></textarea>
        </mat-form-field>

        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Precio</mat-label>
            <input matInput type="number" formControlName="price">
            <span matTextPrefix>$&nbsp;</span>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Stock Inicial</mat-label>
            <input matInput type="number" formControlName="stock">
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Categoría</mat-label>
          <mat-select formControlName="categoryId">
            <mat-option *ngFor="let cat of categories" [value]="cat.id">
              {{ cat.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <div class="image-upload-section">
          <button type="button" mat-stroked-button color="primary" (click)="fileInput.click()">
            <mat-icon>image</mat-icon> Seleccionar Imagen
          </button>
          <input 
            hidden 
            #fileInput 
            type="file" 
            accept="image/*"
            (change)="onFileSelected($event)"
          >
          
          <div *ngIf="imagePreview" class="preview-container">
            <img [src]="imagePreview" alt="Vista previa">
          </div>
        </div>

        <div class="actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="productForm.invalid || !selectedFile" class="full-width">
            PUBLICAR PRODUCTO
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
