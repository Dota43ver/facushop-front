<div class="register-wrapper">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Crear Cuenta</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        
        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="firstname">
            <mat-error>Requerido</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Apellido</mat-label>
            <input matInput formControlName="lastname">
            <mat-error>Requerido</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-error *ngIf="registerForm.get('email')?.hasError('required')">Requerido</mat-error>
          <mat-error *ngIf="registerForm.get('email')?.hasError('email')">Email inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
        </mat-form-field>

        <div *ngIf="errorMessage" class="error-alert">{{ errorMessage }}</div>

        <button mat-flat-button color="primary" type="submit" [disabled]="registerForm.invalid" class="full-width btn-submit">
          REGISTRARSE
        </button>

      </form>
    </mat-card-content>
   <mat-card-actions> <span class="login-link">
        ¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a>
      </span>
    </mat-card-actions>

  </mat-card>
</div>
