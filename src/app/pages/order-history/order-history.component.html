<div class="container">
  <h1>Mis Pedidos</h1>

  <div *ngIf="orders$ | async as orders; else loading">

    <div *ngIf="orders.length === 0" class="empty-state">
      <mat-icon class="empty-icon">history</mat-icon>
      <p>Aún no realizaste compras.</p>
      <button mat-raised-button color="primary" routerLink="/products">
        Ir a la Tienda
      </button>
    </div>

    <div *ngIf="orders.length > 0" class="orders-list">
      
      <mat-card *ngFor="let order of orders" class="order-card">
        
        <div class="order-header">
          <div>
            <span class="order-id">Pedido #{{ order.orderId }}</span>
            </div>
          <div class="order-status">
            <mat-chip highlighted color="accent">PAGADO</mat-chip>
          </div>
        </div>

        <mat-divider></mat-divider>

        <mat-list>
          <mat-list-item *ngFor="let item of order.items" class="order-item">
            <div class="item-content">
              <img [src]="item.productImageUrl" alt="Producto" class="item-thumb">
              <div class="item-details">
                <span class="item-title">{{ item.productTitle }}</span>
                <span class="item-meta">
                  {{ item.quantity }} x ${{ item.priceAtPurchase }}
                </span>
              </div>
              <span class="item-total">${{ item.subtotal }}</span>
            </div>
          </mat-list-item>
        </mat-list>

        <mat-divider></mat-divider>

        <div class="order-footer">
          <span class="total-label">Total Pagado:</span>
          <span class="total-amount">${{ order.totalAmount }}</span>
        </div>

      </mat-card>

    </div>
  </div>

  <ng-template #loading>
    <p class="loading-text">Cargando historial...</p>
  </ng-template>
</div>
